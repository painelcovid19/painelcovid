name: painel covid continues Integration pipeline
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: false
          tags: josedembo/painelcovid:latest